main: net.jandie1505.combattest.CombatTest
name: CombatTest
version: 1.0
commands:
  combattest:
    description: CombatTest command
    usage: /combattest <subcommand>
  pay:
    description: Pay another player some points
    usage: /pay <player> <amount>
  menu:
    description: Opens the player menu
    usage: /menu
  points:
    description: Show your current points
    usage: /points
  stats:
    description: Shows the stats of you or another player
    usage: /stats or /stats playername
  disable-weather:
    description: Disables your own local weather or re-enables it
    usage: /disable-weather
  votemap:
    description: Vote for a map
    usage: /votemap <map>
  start:
    description: Force-start a game
    usage: /start
  combattest-old:
    description: equipment old
    usage: /combattest-old
permissions:
  combattest.admin:
    default: op
    description: admin permission
  combattest.start:
    default: op
    description: Force-start the game using /start
  combattest.forcemap:
    default: op
    description: Allow setting a map using /forcemap
  combattest.*:
    default: op
    children:
      - combattest.admin
author: jandie1505
api-version: 1.21
softdepend: [SuperVanish,PremiumVanish,CloudNet-Bridge]